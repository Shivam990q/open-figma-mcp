[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-figma-sdk"
version = "2.0.0"
description = "Enterprise Python SDK for OpenFigma Model Context Protocol (MCP) server & design engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Shivam", email = "shivam@autonomous.design" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0"
]
