name: Publish to npm

# Publishes when a GitHub Release is created, or manually via the Actions tab.
# Requires an NPM_TOKEN secret (repo → Settings → Secrets → Actions).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Detect npm credentials
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm-auth.outputs.present == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report skipped npm publication
        if: steps.npm-auth.outputs.present == 'false'
        run: echo "::warning title=npm publication skipped::Configure the NPM_TOKEN repository secret before publishing openfigma-mcp to the npm registry."
